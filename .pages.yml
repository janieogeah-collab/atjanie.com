media:
  input: assets/blog
  output: /assets/blog

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [cover, title, date]
      sort: [date desc]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: cover
        label: Cover image
        type: image
        description: Shows at the top of the post and on the Words page. Landscape works best.
      - name: excerpt
        label: Short summary
        type: text
        description: One or two sentences for the Words page and for search results.
      - name: body
        label: Post
        type: rich-text
