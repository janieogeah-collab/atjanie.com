media:
  input: assets/blog
  output: /assets/blog

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [cover, title, date]
      sort: [date desc]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: cover
        label: Cover image
        type: image
        description: Shows at the top of the post and on the Words page. Landscape works best.
      - name: summary
        label: Custom preview text (optional)
        type: text
        description: Leave empty and previews use the opening of the post automatically. Fill it only to override.
      - name: slug
        label: Web address (optional)
        type: string
        description: The end of the post's link, e.g. international-submissions-welcome gives atjanie.com/words/international-submissions-welcome/. Lowercase words joined by hyphens. Leave empty to use the first title.
      - name: redirect_from
        label: Old web addresses (optional)
        type: string
        list: true
        description: If you change the web address of a post people have already shared, add the old address here, e.g. /words/old-address/, so old links still work.
      - name: body
        label: Post
        type: rich-text